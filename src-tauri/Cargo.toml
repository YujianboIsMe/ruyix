[package]
name = "darkhorse-code"
version = "0.1.0"
description = "最好用的IDE，个人使用"
authors = ["醒过来摸鱼"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
portable-pty = "0.8"
arborium = { version = "2", default-features = false, features = ["lang-python", "lang-rust", "lang-html", "lang-css", "lang-javascript", "lang-markdown", "lang-sql"] }
arborium-theme = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
base64 = "0.22"
walkdir = "2"
sha2 = "0.10"
qdrant-edge = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
