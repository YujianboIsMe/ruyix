[package]
name = "ruyix"
version = "1.0.0"
description = "ruyix —— 绿色便携的 AI IDE：一个可执行文件 + global/ + projects/ + plugins/，卸载 = 删文件夹"
authors = ["醒过来摸鱼"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 多实例检测：Windows 命名互斥体；Win32_UI_Shell 是外链出口（ShellExecuteW）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
harness-engine = { path = "../crates/harness-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
# MCP 客户端的请求/响应匹配与超时（tauri 自带的 tokio 不直接暴露给业务代码）
tokio = { version = "1", features = ["rt", "time", "sync"] }
portable-pty = "0.8"
# 内置解析器（tree-sitter）：**可选依赖** —— 纯净模式（--no-default-features）下整个不编进来，
# 于是"语法高亮"这件事在那枚二进制里完全由插件提供（见 src/plugin.rs / src/preinstalled.rs）。
arborium = { version = "2", default-features = false, optional = true, features = ["lang-python", "lang-rust", "lang-html", "lang-css", "lang-javascript", "lang-markdown", "lang-sql", "lang-java"] }
arborium-theme = { version = "2", optional = true }
# query 覆盖（插件的 highlights.scm）要这两样：GrammarConfig / CompiledGrammar
# 公开在 arborium-highlight（arborium 自己的 store/highlighter 是私有的，但它 re-export 了
# GrammarStore 与 Highlighter::with_store）。
arborium-highlight = { version = "2", optional = true }
# query 覆盖（插件的 highlights.scm）要这两样：GrammarConfig / CompiledGrammar
# GrammarStore 与 Highlighter::with_store）。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
base64 = "0.22"
walkdir = "2"
sha2 = "0.10"

[features]
# 两种编译模式（见 doc/highlight-plugins.md）：
#   preinstalled（默认）＝ 内置解析器 + 预装高亮插件（首启物化到 plugins/highlight/ruyix-builtin/）
#   pure          ＝ 一个解析器都不编、一个插件都不预装（plugins/ 由用户自己填）
# 纯净构建：cargo build --no-default-features --features custom-protocol
default = ["custom-protocol", "preinstalled"]
custom-protocol = ["tauri/custom-protocol"]
preinstalled = ["dep:arborium", "dep:arborium-theme", "dep:arborium-highlight"]
pure = []
