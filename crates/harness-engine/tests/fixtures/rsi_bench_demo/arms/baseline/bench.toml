# 基线臂 = 出厂值 + 一处显式取值。
#
# 为什么刻意写一行：**臂的覆盖如果不改变任何东西，它和"键拼错了"在读数上无法区分**，
# 所以评测台会把"覆盖非空但生效配置与基线逐字节相同"直接判成错误（见 rsi_bench.rs）。
# 这一行是安全的无操作（1800 是出厂默认，这里写 1740，只影响墙钟闸，脚本化臂用不到）。
[agent]
# v1.4 P1：写入白名单（自改闭环的边界）。`*.py` 只放行根目录的 Python 文件 ——
# 夹具任务 4 就是"白名单外的写入必须被引擎拒"的证据。
write_allow = ["*.py"]
max_elapsed_secs = 1740
